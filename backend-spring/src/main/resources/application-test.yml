spring:
  datasource:
    url: ${TEST_DATASOURCE_URL:jdbc:h2:mem:farmwise_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: ${TEST_DATASOURCE_USERNAME:sa}
    password: ${TEST_DATASOURCE_PASSWORD:}
    driver-class-name: ${TEST_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    allow-ephemeral-dev-secret: true
  integrations:
    weather:
      provider: disabled-in-test

logging:
  level:
    com.farmwise.backend: INFO
