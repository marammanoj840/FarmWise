spring:
  application:
    name: farmwise-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:12MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  version: 1.0.0
  seed-demo-data: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.netlify.app,https://*.pages.dev,https://*.vercel.app}}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
    issuer: ${JWT_ISSUER:farmwise-api}
  rate-limit:
    auth-requests-per-minute: ${RATE_LIMIT_AUTH_RPM:20}
    api-requests-per-minute: ${RATE_LIMIT_API_RPM:120}
  integrations:
    weather:
      provider: ${WEATHER_PROVIDER:open-meteo}
      base-url: ${WEATHER_API_BASE_URL:https://api.open-meteo.com/v1}
      geocoding-url: ${GEOCODING_API_BASE_URL:https://geocoding-api.open-meteo.com/v1}
      timeout-ms: ${WEATHER_TIMEOUT_MS:5000}
    ai:
      provider: ${AI_PROVIDER:none}
      api-url: ${AI_PROVIDER_URL:}
      api-key: ${AI_PROVIDER_API_KEY:}
      model: ${AI_MODEL:}
    market:
      provider: ${MARKET_DATA_PROVIDER:sample}
      api-url: ${AGMARKNET_API_URL:}
      api-key: ${AGMARKNET_API_KEY:}
    payment:
      provider: ${PAYMENT_PROVIDER:unconfigured}
      key-id: ${PAYMENT_KEY_ID:}
      key-secret: ${PAYMENT_KEY_SECRET:}
    email:
      provider: ${EMAIL_PROVIDER:log}
      from-address: ${SMTP_FROM:noreply@farmwise.local}
      smtp-host: ${SMTP_HOST:}
      smtp-port: ${SMTP_PORT:587}
    sms:
      provider: ${SMS_PROVIDER:log}
      api-key: ${SMS_API_KEY:}
    storage:
      provider: ${STORAGE_PROVIDER:local-metadata}
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:}
      endpoint: ${S3_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
      max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE_BYTES:10485760}
    maps:
      provider: ${MAPS_PROVIDER:open-meteo-geo}
      api-key: ${MAPS_API_KEY:}
