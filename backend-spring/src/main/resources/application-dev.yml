spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/farmwise}
    username: ${SPRING_DATASOURCE_USERNAME:farmwise}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false

management:
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    allow-ephemeral-dev-secret: true
  seed-demo-data: ${SEED_DEMO_DATA:true}
  demo:
    default-password: ${DEMO_DEFAULT_PASSWORD:FarmWiseDemo#2026}

logging:
  level:
    com.farmwise.backend: DEBUG
    org.flywaydb: INFO
