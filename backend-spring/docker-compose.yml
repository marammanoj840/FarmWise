services:
  postgres:
    image: postgres:16-alpine
    container_name: farmwise-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farmwise}
      POSTGRES_USER: ${POSTGRES_USER:-farmwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - farmwise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farmwise} -d ${POSTGRES_DB:-farmwise}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmwise-backend-spring
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-farmwise}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-farmwise}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SERVER_PORT: 8080
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  farmwise_pgdata:
